name: Build and Deploy to Cloud Run

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  PROJECT_ID: manga-tracker-app-io # Google Cloud project id
  GAR_LOCATION: asia-southeast1-docker.pkg.dev/manga-tracker-app-io/mgt-frontend # Artifact Registry location
  SERVICE: manga-tracker-app # Cloud Run service name
  REGION: asia-southeast1 # Cloud Run service region

jobs:
  deploy:
    # Add 'id-token' with the intended permissions for workload identity federation
    permissions:
      contents: "read"
      id-token: "write"

    runs-on: ubuntu-latest
    steps:
      - name: Checkout cli
        uses: actions/checkout@v4
        with:
          path: cli

      # manga-tracker-admin is served from this app's /admin path instead
      # of its own Cloud Run service — build its static output and drop
      # it into cli's public/admin/ before the Next build runs.
      - name: Checkout admin
        uses: actions/checkout@v4
        with:
          repository: JusAeng/manga-tracker-admin
          # manga-tracker-admin is a private repo — the default
          # GITHUB_TOKEN only has access to *this* repo, even across repos
          # owned by the same account. Needs a PAT with read access to
          # manga-tracker-admin, stored as this secret.
          token: ${{ secrets.ADMIN_REPO_TOKEN }}
          path: admin

      - name: Build admin
        run: |-
          cd admin
          npm ci
          npm run build
          mkdir -p ../cli/public/admin
          cp -r dist/* ../cli/public/admin/

      # NOTE: Alternative option - authentication via credentials json
      - name: Google Auth
        id: auth
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.SERVICE_ACCOUNT_KEY }}"

      # Authenticate Docker to Google Cloud Artifact Registry
      - name: Authen Docker to GAR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}
          username: _json_key
          password: ${{ secrets.SERVICE_ACCOUNT_KEY }}

      # NEXT_PUBLIC_* vars are inlined into the client bundle at build
      # time (see Dockerfile), so they're passed in as build args here.
      # These aren't secrets (they end up in the browser bundle either
      # way) — set them as repo Variables: Settings > Secrets and
      # variables > Actions > Variables tab.
      - name: Build and Push Container
        run: |-
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ vars.NEXT_PUBLIC_API_BASE_URL }}" \
            --build-arg NEXT_PUBLIC_LIFF_ID="${{ vars.NEXT_PUBLIC_LIFF_ID }}" \
            -t "${{ env.GAR_LOCATION }}/${{env.SERVICE}}" ./cli
          docker push "${{ env.GAR_LOCATION }}/${{env.SERVICE}}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}/${{env.SERVICE}}:latest
