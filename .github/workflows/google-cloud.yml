name: Build and Deploy to Cloud Run

on:
  push:
    branches: ["main"]

env:
  PROJECT_ID: totemic-life-417117 # Google Cloud project id
  GAR_LOCATION: asia-southeast1-docker.pkg.dev/totemic-life-417117/mgt-frontend # Artifact Registry location
  SERVICE: manga-tracker-app # Cloud Run service name
  REGION: asia-southeast1 # Cloud Run service region

jobs:
  deploy:
    # Add 'id-token' with the intended permissions for workload identity federation
    permissions:
      contents: "read"
      id-token: "write"

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: Alternative option - authentication via credentials json
      - name: Google Auth
        id: auth
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.SERVICE_ACCOUNT_KEY }}"

      # Authenticate Docker to Google Cloud Artifact Registry
      - name: Authen Docker to GAR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}
          username: _json_key
          password: ${{ secrets.SERVICE_ACCOUNT_KEY }}

      # - name: Create .env
      #   run: |-
      #     echo "LINECLIENTID=${{secrets.LINECLIENTID}}" >> .env \
      #     && echo "JWT_SIGNED_STRING=${{secrets.JWT_SIGNED_STRING}}" >> .env

      - name: Build and Push Container
        run: |-
          docker build -t "${{ env.GAR_LOCATION }}/${{env.SERVICE}}" ./
          docker push "${{ env.GAR_LOCATION }}/${{env.SERVICE}}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          # NOTE: If using a pre-built image, update the image name here
          image: ${{ env.GAR_LOCATION }}/${{env.SERVICE}}:latest
